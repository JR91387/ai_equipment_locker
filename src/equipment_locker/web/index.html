<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipment Locker</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="#/" aria-label="Equipment Locker home">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="1.5"/><path d="M3 10h18"/><path d="M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6"/><polygon points="12 12 12.9 13.8 14.9 14.1 13.45 15.5 13.8 17.5 12 16.55 10.2 17.5 10.55 15.5 9.1 14.1 11.1 13.8 12 12" fill="currentColor" stroke="none"/></svg></span>
    <span class="title">Equipment Locker</span>
  </a>
  <input id="q" class="search" type="search" placeholder="Search tools, skills, folders…" autocomplete="off" aria-label="Search">
  <nav class="views" aria-label="View">
    <a href="#/" data-view="shelves">Shelves</a>
    <a href="#/table" data-view="table">Table</a>
  </nav>
  <button id="refresh" class="quiet" type="button" title="Scan now">Refresh</button>
  <span id="scan" class="scan" aria-live="polite"></span>
</header>
<main id="view" tabindex="-1"></main>
<aside id="detail" class="panel" hidden aria-label="Details" tabindex="-1"></aside>
<div id="toast" class="toast" hidden role="status"></div>
<script src="app.js"></script>
<script src="views.js"></script>
<script src="detail.js"></script>
</body>
</html>
